<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>IHMS - سجل مواعيدي</title>
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
        <link
            href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap"
            rel="stylesheet">
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <link rel="stylesheet"
            href="{{ url_for('static', filename='stylesheet.css') }}">
        <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8f9fa; padding-bottom: 80px; }
        .app-card { border-radius: 15px; border: none; transition: 0.3s; }
        .status-upcoming { border-right: 5px solid #0d6efd; }
        .status-completed { border-right: 5px solid #198754; }
        .status-cancelled { border-right: 5px solid #dc3545; }
        .badge-upcoming { background-color: #e7f1ff; color: #0d6efd; }
        .badge-completed { background-color: #e6f4ea; color: #198754; }
    </style>
    </head>
    <body>

        <div class="container py-4">
            <div class="d-flex align-items-center mb-4">
                <a href="{{ url_for('patient_portal') }}"
                    class="btn btn-light rounded-circle me-3 shadow-sm">
                    <i class="bi bi-arrow-right"></i>
                </a>
                <h4 class="fw-bold mb-0">سجل المواعيد</h4>
            </div>

            {% if appointments %}
            {% for app in appointments %}
            <div class="card app-card shadow-sm mb-3 
                {% if app.status == 'قادم' %}status-upcoming
                {% elif app.status == 'تم الكشف' %}status-completed
                {% else %}status-cancelled{% endif %}">
                <div class="card-body">
                    <div
                        class="d-flex justify-content-between align-items-start">
                        <div>
                            <span class="badge rounded-pill mb-2 
                                {% if app.status == 'قادم' %}badge-upcoming
                                {% else %}badge-completed{% endif %}">
                                {{ app.status }}
                            </span>
                            <h6 class="fw-bold mb-1"><i
                                    class="bi bi-calendar3 me-2"></i>{{ app.date
                                }}</h6>
                            <p class="text-muted small mb-0"><i
                                    class="bi bi-clock me-2"></i>{{ app.time
                                }}</p>
                        </div>
                        <i class="bi bi-chevron-left text-muted"></i>
                    </div>
                    {% if app.notes %}
                    <hr class="opacity-25">
                    <p
                        class="small text-secondary mb-0"><strong>ملاحظاتي:</strong>
                        {{ app.notes }}</p>
                    {% endif %}
                </div>
            </div>
            {% endfor %}
            {% else %}
            <div class="text-center py-5">
                <i class="bi bi-calendar-x fs-1 text-muted"></i>
                <p class="mt-3 text-secondary">لا توجد مواعيد مسجلة حالياً</p>
            </div>
            {% endif %}
        </div>

        <div class="bottom-nav shadow">
            <a href="{{ url_for('patient_portal') }}" class="nav-item">
                <i class="bi bi-house-door"></i>
                <span>الرئيسية</span>
            </a>
            <a href="{{ url_for('my_appointments') }}" class="nav-item active">
                <i class="bi bi-calendar-check"></i>
                <span>مواعيدي</span>
            </a>
            <a href="{{ url_for('patient_profile') }}"
                class="nav-item">
                <i class="bi bi-person-fill d-block fs-4"></i>
                <small>ملفي</small>
            </a>
            <a href="{{ url_for('patient_logout') }}" class="nav-item">
                <i class="bi bi-box-arrow-left text-danger"></i>
                <span>خروج</span>
            </a>
        </div>

    </body>
</html>
