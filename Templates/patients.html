<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>IHMS - إدارة المرضى</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../static/stylesheet.css">
</head>
<body>

    <div class="sidebar d-flex flex-column p-3">
        <h3 class="text-center mb-4 text-primary fw-bold">IHMS</h3>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
            <li><a href="{{ url_for('admin_dashboard') }}" class="nav-link">لوحة التحكم</a></li>
            <li><a href="{{ url_for('patients_list') }}" class="nav-link active">إدارة المرضى</a></li>
            <li><a href="{{ url_for('inventory') }}" class="nav-link">المخزون</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>سجل المرضى</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPatientModal">
                <i class="bi bi-person-plus"></i> تسجيل مريض جديد
            </button>
        </div>

        <div class="card shadow-sm p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">الرقم القومي</th>
                        <th>الاسم بالكامل</th>
                        <th>الجنس</th>
                        <th>رقم الهاتف</th>
                        <th>فصيلة الدم</th>
                        <th class="text-center">إجراءات</th>
                    </tr>
                </thead>
                <tbody>
                    {% for patient in patients %}
                    <tr>
                        <td class="ps-4">{{ patient.national_id }}</td>
                        <td>{{ patient.name }}</td>
                        <td>{{ patient.gender }}</td>
                        <td>{{ patient.phone }}</td>
                        <td><span class="badge bg-info text-dark">{{ patient.blood_type }}</span></td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-secondary"><i class="bi bi-eye"></i></button>
                            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="addPatientModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">تسجيل مريض جديد</h5>
                    <button type="button" class="btn-close m-0" data-bs-dismiss="modal"></button>
                </div>
                <form action="{{ url_for('add_patient') }}" method="POST">
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">الاسم بالكامل</label>
                                <input type="text" name="full_name" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">الرقم القومي</label>
                                <input type="text" name="national_id" class="form-control" maxlength="14" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">تاريخ الميلاد</label>
                                <input type="date" name="birth_date" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">الجنس</label>
                                <select name="gender" class="form-select">
                                    <option value="ذكر">ذكر</option>
                                    <option value="أنثى">أنثى</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">فصيلة الدم</label>
                                <select name="blood_type" class="form-select">
                                    <option value="A+">A+</option><option value="A-">A-</option>
                                    <option value="B+">B+</option><option value="B-">B-</option>
                                    <option value="O+">O+</option><option value="O-">O-</option>
                                    <option value="AB+">AB+</option><option value="AB-">AB-</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">التاريخ المرضي / ملاحظات</label>
                                <textarea name="medical_history" class="form-control" rows="3"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                        <button type="submit" class="btn btn-primary">حفظ البيانات</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
